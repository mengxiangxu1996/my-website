<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">国学风掌纹分析主视觉</title>
  <desc id="desc">宣纸、山水、竹影、朱印和掌纹组成的国学风视觉图</desc>
  <defs>
    <radialGradient id="paperGlow" cx="47%" cy="35%" r="68%">
      <stop offset="0" stop-color="#f8efe0"/>
      <stop offset=".55" stop-color="#e2cfaa"/>
      <stop offset="1" stop-color="#9a7b51"/>
    </radialGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14312f"/>
      <stop offset=".55" stop-color="#263a31"/>
      <stop offset="1" stop-color="#0b1715"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d18b"/>
      <stop offset=".5" stop-color="#b88746"/>
      <stop offset="1" stop-color="#fff1bf"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#07100f" flood-opacity=".35"/>
    </filter>
  </defs>

